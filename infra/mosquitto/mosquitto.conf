persistence false
log_dest stdout
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd

# Internal: ChirpStack, ingest service, gateway bridge (Docker network only, not published)
listener 1883

# External: gateways with ChirpStack MQTT forwarder, TLS only (design doc 7.5, 16.5)
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
