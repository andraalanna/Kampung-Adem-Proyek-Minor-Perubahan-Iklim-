# AS923-2 (Indonesia): AS923 shifted down 1.8 MHz, LoRa Alliance RP2-1.0.x.
# Channel list matches ChirpStack's upstream region_as923_2.toml example. Verify against the
# upstream file and the gateway's frequency plan (Dragino LPS8N: AS923-2) before deployment.

[[regions]]
  id = "as923_2"
  description = "AS923-2 (Indonesia)"
  common_name = "AS923_2"

  [regions.gateway]
    force_gws_private = false

    [regions.gateway.backend]
      enabled = "mqtt"

      [regions.gateway.backend.mqtt]
        topic_prefix = "as923_2"
        server = "tcp://mosquitto:1883"
        username = "chirpstack"
        password = "$MQTT_CHIRPSTACK_PASSWORD"
        qos = 0
        clean_session = false
        client_id = ""

    # Default join channels
    [[regions.gateway.channels]]
      frequency = 921400000
      bandwidth = 125000
      modulation = "LORA"
      spreading_factors = [7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency = 921600000
      bandwidth = 125000
      modulation = "LORA"
      spreading_factors = [7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency = 921800000
      bandwidth = 125000
      modulation = "LORA"
      spreading_factors = [7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency = 922000000
      bandwidth = 125000
      modulation = "LORA"
      spreading_factors = [7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency = 922200000
      bandwidth = 125000
      modulation = "LORA"
      spreading_factors = [7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency = 922400000
      bandwidth = 125000
      modulation = "LORA"
      spreading_factors = [7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency = 922600000
      bandwidth = 125000
      modulation = "LORA"
      spreading_factors = [7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency = 922800000
      bandwidth = 125000
      modulation = "LORA"
      spreading_factors = [7, 8, 9, 10, 11, 12]

  [regions.network]
    installation_margin = 10
    rx_window = 0
    rx1_delay = 1
    rx1_dr_offset = 0
    rx2_dr = 2
    rx2_frequency = 921400000
    rx2_prefer_on_rx1_dr_lt = 0
    rx2_prefer_on_link_budget = false
    downlink_tx_power = -1
    adr_disabled = false
    min_dr = 0
    max_dr = 5
    enabled_uplink_channels = []

    # Extra channels pushed to devices after join (the first two are join defaults)
    [[regions.network.extra_channels]]
      frequency = 921800000
      min_dr = 0
      max_dr = 5

    [[regions.network.extra_channels]]
      frequency = 922000000
      min_dr = 0
      max_dr = 5

    [[regions.network.extra_channels]]
      frequency = 922200000
      min_dr = 0
      max_dr = 5

    [[regions.network.extra_channels]]
      frequency = 922400000
      min_dr = 0
      max_dr = 5

    [[regions.network.extra_channels]]
      frequency = 922600000
      min_dr = 0
      max_dr = 5

    [[regions.network.extra_channels]]
      frequency = 922800000
      min_dr = 0
      max_dr = 5

    [regions.network.rejoin_request]
      enabled = false
      max_count_n = 0
      max_time_n = 0

    [regions.network.class_b]
      ping_slot_dr = 3
      ping_slot_frequency = 0
